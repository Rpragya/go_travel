# Full stack: http://localhost:8080 (app) · http://localhost:8080/api/docs/ (API docs)
x-backend-env: &backend-env
  DATABASE_URL: postgres://gotravels:gotravels@db:5432/gotravels
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-key-change-me-please-32chars}
  ALLOWED_HOSTS: localhost,127.0.0.1,backend
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  CSRF_TRUSTED_ORIGINS: http://localhost:8080
  FRONTEND_URL: http://localhost:8080
  SECURE_SSL_REDIRECT: "False"
  RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
  RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
  RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gotravels
      POSTGRES_USER: gotravels
      POSTGRES_PASSWORD: gotravels
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gotravels"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  backend:
    build: ./backend
    environment: *backend-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./backend
    command: celery -A config worker -l info
    environment: *backend-env
    depends_on: [backend]

  beat:
    build: ./backend
    command: celery -A config beat -l info
    environment: *backend-env
    depends_on: [backend]

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on: [backend]

volumes:
  pgdata:
